<style>
/* Layout: graph-paper exam sheet; sticky header + tab rail; one column of "sheets" (cards) max 960px. Ink-blue pen, pencil-yellow highlight, red-pen corrections. */
:root{
  --paper:#f4f7fb; --sheet:#ffffff; --ink:#17213b; --muted:#5b6782; --line:#d8dfeb; --grid:rgba(38,71,184,.07);
  --accent:#2647b8; --accent-ink:#ffffff; --accent-soft:#e6ecfb; --pencil:#f5d565; --pencil-soft:#fff6cf;
  --pass:#1b7a4c; --pass-soft:#e2f4ea; --fail:#c0352a; --fail-soft:#fbe7e4; --code-bg:#eef2f9; --code-ink:#1d2a4d;
  --k:#7a2fb8; --s:#1b7a4c; --n:#b0560d; --c:#7b86a1; --f:#2647b8;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1422; --sheet:#151d2f; --ink:#e3e8f4; --muted:#9aa5bf; --line:#28324b; --grid:rgba(138,166,255,.05);
  --accent:#8ea8ff; --accent-ink:#0e1422; --accent-soft:#1e2944; --pencil:#e6c35a; --pencil-soft:#2e2a17;
  --pass:#5ccb95; --pass-soft:#14301f; --fail:#ff8073; --fail-soft:#3a1b18; --code-bg:#0f1729; --code-ink:#dbe3f7;
  --k:#c79bff; --s:#7fd8a8; --n:#f0a868; --c:#7380a0; --f:#8ea8ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1422; --sheet:#151d2f; --ink:#e3e8f4; --muted:#9aa5bf; --line:#28324b; --grid:rgba(138,166,255,.05);
  --accent:#8ea8ff; --accent-ink:#0e1422; --accent-soft:#1e2944; --pencil:#e6c35a; --pencil-soft:#2e2a17;
  --pass:#5ccb95; --pass-soft:#14301f; --fail:#ff8073; --fail-soft:#3a1b18; --code-bg:#0f1729; --code-ink:#dbe3f7;
  --k:#c79bff; --s:#7fd8a8; --n:#f0a868; --c:#7380a0; --f:#8ea8ff; color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font:15px/1.6 var(--body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px;flex-wrap:wrap}
.brand h1{font:800 22px/1 var(--display);font-stretch:85%;letter-spacing:-.01em;margin:0;text-wrap:balance}
.brand h1 b{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--body);padding:6px 10px;border-radius:999px;background:var(--pencil-soft);border:1px solid var(--pencil);color:var(--ink);font-variant-numeric:tabular-nums}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:6px 10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:1px solid transparent;background:none;color:var(--muted);font:600 13.5px/1 var(--body);padding:9px 12px;border-radius:8px;cursor:pointer}
nav.tabs button:hover{color:var(--ink);background:var(--sheet)}
nav.tabs button[aria-selected="true"]{color:var(--accent-ink);background:var(--accent)}
main{padding-block:20px 60px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
h2{font:800 28px/1.1 var(--display);font-stretch:80%;margin:0 0 4px;text-wrap:balance}
h3{font:700 18px/1.25 var(--display);font-stretch:95%;margin:0;text-wrap:balance}
h4{font:600 12px/1.2 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px}
p{margin:0 0 8px;max-width:68ch}
.lede{color:var(--muted);max-width:68ch;margin-bottom:4px}
.muted{color:var(--muted)}
.small{font-size:13px}
code,pre,.mono{font-family:var(--mono);font-size:13px}
:not(pre)>code{background:var(--code-bg);padding:1px 5px;border-radius:4px;color:var(--code-ink)}
pre.code{background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:6px 0;overflow-x:auto;line-height:1.55;tab-size:4;white-space:pre}
pre.code .kw{color:var(--k);font-weight:600} pre.code .st{color:var(--s)} pre.code .nu{color:var(--n)} pre.code .cm{color:var(--c);font-style:italic} pre.code .fn{color:var(--f)}
.btn{font:600 13.5px/1 var(--body);border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:10px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],textarea,select{font:14px/1.5 var(--mono);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;tab-size:4}
.pill{display:inline-block;font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.pill.off{background:var(--pencil-soft);color:var(--ink);border:1px solid var(--pencil)}
.pill.lvl{background:none;border:1px solid var(--line);color:var(--muted)}
.ok{color:var(--pass)} .bad{color:var(--fail)}
.verdict{border-radius:8px;padding:12px 14px;border:1px solid}
.verdict.ok{background:var(--pass-soft);border-color:var(--pass);color:var(--ink)}
.verdict.bad{background:var(--fail-soft);border-color:var(--fail);color:var(--ink)}
.verdict strong.ok{color:var(--pass)} .verdict strong.bad{color:var(--fail)}
mark{background:var(--pencil-soft);color:inherit;border-bottom:2px solid var(--pencil);padding:0 2px}
a{color:var(--accent)}
/* plan */
.day{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:start}
@media(max-width:620px){.day{grid-template-columns:1fr}}
.day .date{font:800 20px/1 var(--display);font-stretch:80%}
.day .date span{display:block;font:500 12px/1.3 var(--body);color:var(--muted);margin-top:6px}
.day.today{outline:2px solid var(--pencil);outline-offset:-2px}
.task{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:0}
.task input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px;flex:0 0 auto}
.task .mins{font:600 12px/1.6 var(--mono);color:var(--muted);flex:0 0 40px;font-variant-numeric:tabular-nums}
.task .txt{flex:1;min-width:0}
.task.done .txt{text-decoration:line-through;color:var(--muted)}
.task .go{font-size:12px;white-space:nowrap}
.extra{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 2px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.statrow{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;font-size:13px;padding:3px 0}
.statrow .num{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.statrow.weak .lbl{color:var(--fail);font-weight:600}
/* learn */
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc button{border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 11px;font:500 13px/1 var(--body);cursor:pointer}
.toc button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.toc button .w{font-size:10px;color:var(--muted);margin-left:4px}
ul.gotcha{margin:0;padding-left:18px} ul.gotcha li{margin:4px 0;max-width:72ch}
.lessonhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.src{font-size:12px;color:var(--muted)}
/* trace */
.tlist{display:flex;flex-wrap:wrap;gap:6px}
.tlist button{border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:8px;padding:7px 10px;font:500 13px/1.2 var(--body);cursor:pointer;text-align:left}
.tlist button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tlist button .st{display:block;font-size:11px;color:var(--muted)}
.tlist button.done .st{color:var(--pass)}
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.trace{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
table.trace th{font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:2px solid var(--ink);background:var(--paper)}
table.trace td{padding:5px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.trace td.fr{font:600 12.5px var(--mono);color:var(--accent)}
table.trace td.v{font:600 13px var(--mono)}
table.trace td.v.outv{color:var(--n)}
table.trace td.n{font-size:12.5px;color:var(--muted)}
table.trace td.i{width:34%}
table.trace input{padding:5px 8px;font-size:13px}
table.trace input.ok{border-color:var(--pass);background:var(--pass-soft)}
table.trace input.bad{border-color:var(--fail);background:var(--fail-soft)}
table.trace tr.newframe td{border-top:2px solid var(--line)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:start}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.sticky{position:sticky;top:120px}
@media(max-width:820px){.sticky{position:static}}
/* quiz */
.qcard{display:flex;flex-direction:column;gap:12px}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qtext{white-space:pre-wrap;font-size:15.5px;max-width:70ch}
.qtext.codey{font-family:var(--mono);font-size:13.5px;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;white-space:pre;overflow-x:auto;max-width:none}
.choices{display:grid;gap:8px}
.choices button{text-align:left;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:10px 12px;font:14px/1.45 var(--body);cursor:pointer;white-space:pre-wrap;display:flex;gap:10px}
.choices button .k{font:700 12px/1.6 var(--mono);color:var(--muted)}
.choices button:hover{border-color:var(--accent)}
.choices button.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.choices button.right{border-color:var(--pass);background:var(--pass-soft)}
.choices button.wrong{border-color:var(--fail);background:var(--fail-soft)}
.scoreline{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.scoreline b{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--sheet);color:var(--muted);padding:8px 12px;font:600 13px/1 var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
/* exam */
.timer{font:800 34px/1 var(--display);font-stretch:75%;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer.low{color:var(--fail)}
.examhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;position:sticky;top:96px;z-index:5}
@media(max-width:620px){.examhead{top:88px}}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:10px}
.qhead .pts{font:600 13px var(--mono);color:var(--muted)}
table.expr{border-collapse:collapse;width:100%;min-width:460px}
table.expr td,table.expr th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13.5px}
table.expr th{font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
table.expr td:first-child{font-family:var(--mono);white-space:nowrap}
table.expr input.ok{border-color:var(--pass);background:var(--pass-soft)} table.expr input.bad{border-color:var(--fail);background:var(--fail-soft)}
.key{border-left:3px solid var(--pencil);background:var(--pencil-soft);padding:10px 14px;border-radius:0 8px 8px 0}
.selfscore{display:flex;align-items:center;gap:8px;font-size:13px}
.selfscore input{width:70px}
.rubric{margin:4px 0 0;padding-left:18px;font-size:13.5px}
.total{font:800 44px/1 var(--display);font-stretch:75%;font-variant-numeric:tabular-nums}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:3px 0}
.check .m{font:700 13px var(--mono);flex:0 0 18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:13px;z-index:30}
dl.terms{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:0;margin:4px 0 6px;border-top:1px solid var(--line)}
dl.terms dt,dl.terms dd{min-width:0;padding:8px 0;border-bottom:1px solid var(--line);margin:0}
dl.terms dt{font:700 14px/1.35 var(--display);font-stretch:95%;padding-right:12px}
dl.terms dd p{margin:0}
dl.terms dd pre{margin:4px 0 0;font:12.5px/1.45 var(--mono);color:var(--code-ink);background:var(--code-bg);border-radius:4px;padding:3px 7px;display:inline-block;white-space:pre;max-width:100%;overflow-x:auto}
@media(max-width:560px){dl.terms{grid-template-columns:minmax(0,1fr)}dl.terms dt{border-bottom:0;padding-bottom:0}}
.flash{border:1px solid var(--line);border-radius:10px;padding:22px;background:var(--paper);text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.flash .term{font:800 26px/1.15 var(--display);font-stretch:85%}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .25s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>

function hl(code){
  const re=/(#[^\n]*)|('''[\s\S]*?'''|"""[\s\S]*?"""|"[^"\n]*"|'[^'\n]*'|“[^”\n]*”)|(\b\d+\.?\d*\b)|([A-Za-z_][A-Za-z_0-9]*)|([\s\S])/g;

L.gotchas={title:'Exam-morning gotchas',src:'Pulled from every practice sheet and the Practice Midterm',html:`
<p class="lede">If you only read one thing on Friday morning, read this.</p>
<ul class="gotcha">
<li>A <b>variable</b> is a named box and a <b>value</b> is what's in it. <code>b = a</code> copies the value, so changing <code>a</code> later doesn't change <code>b</code>. <code>"age"</code> is a str value; <code>age</code> is a variable.</li>
<li><code>/</code> ALWAYS gives a float: <code>12/6</code> → <code>2.0</code>. <code>//</code> and <code>%</code> on two ints give an int.</li>
<li><code>int(8.6)</code> → <code>8</code> chops the decimal off. <code>round(8.6)</code> → <code>9</code>, an int. <code>math.ceil</code> and <code>math.floor</code> also return ints.</li>
<li>int + float → float: <code>9 * 2.0</code> → <code>18.0</code>. Always write the type next to the value.</li>
<li><code>input()</code> always returns a <b>str</b>. <code>"2" == 2</code> is <b>False</b>.</li>
<li><code>not</code> runs before <code>and</code>, and <code>and</code> runs before <code>or</code>. <code>not False or True</code> → True.</li>
<li><code>if x == 1 or 2:</code> is ALWAYS True. Write <code>x == 1 or x == 2</code>.</li>
<li>Only ONE branch of an if/elif/else runs. Two separate <code>if</code>s can both run.</li>
<li>Check boundaries carefully: <code>20 &lt; 20</code> is False and <code>20 &lt;= 20</code> is True.</li>
<li>A while loop checks its condition at the TOP. Count the passes and watch for off-by-one.</li>
<li>Changing a parameter never changes the caller's variable. A return value that isn't stored (e.g. <code>bump(x)</code> on its own) is thrown away.</li>
<li>A function with no <code>return</code> returns <code>None</code>. Printing is not returning.</li>
<li><code>print("result: ", z)</code> puts a space between arguments, so the output is <code>result:  3</code> with two spaces.</li>
<li>Stub = header + docstring + <code>pass</code>. Tests print PASS or FAIL, never <code>assert</code>. <code>main()</code> calls every test function, and <code>main()</code> is called on the last line.</li>
<li>With stubs, every test should print FAIL. Don't call <code>round(result)</code> on a stub's <code>None</code>, because it crashes.</li>
<li><code>random.randint(1, 6)</code> includes BOTH ends. <code>range(1, 6)</code> stops BEFORE 6.</li>
</ul><h4>Quiz 7: strings, range, for loops</h4><ul class="gotcha">
<li>A slice <code>s[a:b]</code> includes index a and stops BEFORE b. <code>s[:b]</code> starts at 0, <code>s[a:]</code> runs to the end, and <code>s[-1]</code> is the last character.</li>
<li>Count spaces as characters when you number the indexes. Write the indexes under the string before you slice.</li>
<li><code>range(3, 3)</code> and <code>range(10, 1, 2)</code> are EMPTY. Counting down needs a negative step, and the stop is still excluded: <code>range(10, 1, -2)</code> → 10 8 6 4 2.</li>
<li>To make 1, 3, 5, 7 the stop must be past 7: <code>range(1, 8, 2)</code>. To make -1 … -4: <code>range(-1, -5, -1)</code>.</li>
<li><code>ord('A')</code> = 65, <code>ord('a')</code> = 97, and lowercase is 32 above uppercase. Lowercase test: <code>97 &lt;= ord(ch) &lt;= 122</code>.</li>
<li>String accumulator: <code>new_str = ""</code> BEFORE the loop, then <code>new_str = new_str + …</code> inside it.</li>
<li>Need the position (even index, i % 2)? Use <code>for i in range(len(s))</code> and <code>s[i]</code>. Only need the characters? <code>for ch in s</code>.</li>
<li>Early return: <code>return True</code> inside the loop, <code>return False</code> AFTER the loop. Never in an else inside the loop.</li>
<li><b>From your Quiz 7:</b> "print every character except X, using range" means <code>for i in range(len(s)):</code> then <code>if s[i] != X:</code> then <code>print(s[i])</code>. <code>replace</code> doesn't loop or print one per line.</li>
</ul>`};

L.vars={title:'Variables vs values',src:'Week 1 · 171-03 Programming Basics ("A Value", "Variables") · Practice 1',html:`
<div class="twrap"><table class="trace" style="min-width:0"><tr><th></th><th>Value</th><th>Variable</th></tr>
<tr><td><b>What it is</b></td><td>The data itself: the basic building block you save and manipulate. Also called a <b>literal</b>.</td><td>A <b>named spot in memory</b> where the computer stores a value.</td></tr>
<tr><td><b>Examples</b></td><td><code>18</code> <code>2.0</code> <code>"Hannah"</code> <code>True</code></td><td><code>age</code> <code>price</code> <code>name</code> <code>is_good_dog</code></td></tr>
<tr><td><b>Has a type?</b></td><td>Yes, always (int, float, str, bool).</td><td>Its type is the type of the value it holds <i>right now</i>.</td></tr>
<tr><td><b>Can it change?</b></td><td>No. <code>5</code> is always 5.</td><td>Yes. Assign again and the old value is overwritten.</td></tr>
<tr><td><b>How many?</b></td><td>—</td><td>It holds <b>one value at a time</b>.</td></tr>
<tr><td><b>Python tracks</b></td><td>—</td><td>Its <b>name, value and data type</b>.</td></tr></table></div>
<h4>Assignment: how a value gets into a variable</h4>
${pre(`age = 18          # the value 18 (int) is stored in the variable age
name = "Hannah"   # the value "Hannah" (str) is stored in name
x = 4
y = 5
x = x + y         # 1. get the values from memory (4 and 5)
                  # 2. do the operation (+)  -> 9
                  # 3. store the result in x  (4 is overwritten)`)}
<p>Always read <code>=</code> right to left: <b>work out the value on the right, then store it in the variable on the left.</b> An <b>expression</b> such as <code>head_count * 10</code> is made of values, variables and operators, and it always works out to a single value.</p>
<h4>Copying a value is not linking</h4>
${pre(`a = 10
b = a       # copies the VALUE 10 into b
a = 20      # a now holds 20; b still holds 10
print(a, b) # 20 10`)}
<h4>Common mistakes</h4>
<ul class="gotcha">
<li><code>print("age")</code> prints the letters <code>age</code>, while <code>print(age)</code> prints the value inside the variable. Quotes make a str value.</li>
<li><code>5 = num1</code> is backwards. The variable always goes on the left.</li>
<li>Using a variable before it has a value raises a <b>NameError</b>: variables need to be initialized.</li>
<li><code>total + 5</code> on its own line works out a value and throws it away. You need <code>total = total + 5</code>.</li>
<li><code>a = b</code> followed by <code>b = a</code> does NOT swap them: both end up holding b's value. Use a <code>temp</code> variable.</li>
<li>A variable can hold a different type later (<code>x = 5</code>, then <code>x = "five"</code>). Its type follows its current value.</li>
</ul>
<h4>The same idea in functions</h4>
<p>In a call like <code>double(7)</code>, the argument <b>value</b> 7 is copied into the parameter <b>variable</b> <code>n</code>. That's why changing a parameter never changes the caller's variable, and why the trace table has one row each time a variable gets a new value.</p>
<h4>Worked example (Practice 1 Q3, labelled)</h4>
${pre(`num1 = 1            # variable num1  <- value 1      (int)
num2 = 2.0          # variable num2  <- value 2.0    (float)
str1 = "bob"        # variable str1  <- value "bob"  (str)
result = num1 + num2   # expression -> value 3.0 (float) -> stored in result
result = str(num2)     # result now holds "2.0" (str); the 3.0 is gone`)}`};
L.types={title:'Variables, data types & casting',src:'Week 1–2 · 171-03 Programming Basics · Practice 1 · Quiz 2',html:`
<h4>The four types you need</h4>
<p><b>int</b> <code>5, -10, 405</code> · <b>float</b> <code>2.0, -3.33, .000001</code> · <b>str</b> <code>"33", 'dog', "5+5"</code> · <b>bool</b> <code>True, False</code></p>
${pre(`age = 18            # = is assignment: the variable on the LEFT gets the value
name = "Hannah"     # str
age = age + 1       # update: the old value is overwritten
x = input("Age: ")  # input() ALWAYS returns a str
age = int(x)        # cast str to int
price = float("5.5")    # 5.5
label = str(2.0)        # "2.0"`)}
<h4>Casting rules</h4>
<ul class="gotcha">
<li><code>int(3.9)</code> → <code>3</code>: it truncates and does not round.</li>
<li><code>int("3.7")</code> crashes with a ValueError. Use <code>int(float("3.7"))</code> → <code>3</code>.</li>
<li><code>float(1)</code> → <code>1.0</code> and <code>str(5)+"-star"</code> → <code>"5-star"</code>.</li>
</ul>
<h4>Variable names</h4>
<p>Use letters, digits and <code>_</code>. A name can't start with a digit, is case-sensitive, and can't be a reserved word. Every variable has a name, a value and a type.</p>
<h4>Common mistakes</h4>
<ul class="gotcha"><li><code>5 = num1</code> is backwards; it must be <code>num1 = 5</code>.</li><li><code>"Age: " + 19</code> crashes. Use <code>"Age: " + str(19)</code> or <code>print("Age:", 19)</code>.</li><li>Forgetting that <code>"5" + "5"</code> → <code>"55"</code>.</li></ul>
<h4>Worked example (Practice 1 Q3)</h4>
${pre(`num1 = 1          # 1      int
num2 = 2.0        # 2.0    float
str2 = "5.5"      # "5.5"  str
result = num1 + num2      # 3.0   float  (int + float -> float)
result = float(str2)      # 5.5   float
result = str(num2)        # "2.0" str
result = 5/6              # 0.833333  float
result = 6/3.0            # 2.0   float`)}`};

6 / 3      # 2.0   float
7 // 2     # 3     int    -- whole times 2 fits into 7

7.0 // 2   # 3.0   float  -- a float in -> a float out

round(3.236, 2)   # 3.24  float
import math       # goes at the TOP of the file
math.ceil(3.236)  # 4  int  -- always rounds UP
math.floor(3.236) # 3  int  -- always rounds DOWN
math.floor(-2.5)  # -3 (down means toward negative infinity)`)}
<h4>Precedence (high → low)</h4>
<p><code>( )</code> → <code>* / // %</code> left to right → <code>+ -</code> → comparisons <code>&lt; &lt;= &gt; &gt;= == !=</code> → <code>not</code> → <code>and</code> → <code>or</code></p>
<h4>Uses of %</h4>
<ul class="gotcha"><li>Even test: <code>n % 2 == 0</code>. Divisibility: <code>year % 4 == 0</code>.</li><li><code>a % b == 0</code> means b divides a evenly. This shows up in Practice Midterm Q3.</li></ul>
<h4>Common mistakes</h4>
<ul class="gotcha"><li>Writing <code>2</code> for <code>12/6</code>; the answer is <code>2.0</code>.</li><li>Writing <code>9</code> for <code>int(8.6)</code>; int truncates, so it's <code>8</code>.</li><li>Rounding an exact .5: <code>round(2.5)</code> is <code>2</code> because Python rounds to the even number.</li></ul>
<h4>Worked example (Practice Midterm Q1 setup)</h4>
${pre(`num1 = 4.3
num2 = 2.0
num3 = round(num1*num2)   # round(8.6) = 9   int
x = 12/6                  # 2.0              float
num3 * x                  # 9 * 2.0 = 18.0   float
math.ceil(num1+num2)      # ceil(6.3) = 7    int
int(num1 * x)             # int(8.6) = 8     int
num3 % 2                  # 9 % 2 = 1        int`)}`};

L.bool={title:'Boolean expressions & conjunctions',src:'Week 4 · 171-07 Boolean Expressions · Practice 2 & 3 · Quiz 3',html:`
<p>A Boolean expression evaluates to <code>True</code> or <code>False</code>. Comparisons: <code>&gt; &lt; == &gt;= &lt;= !=</code>. Conjunctions: <code>and or not</code>.</p>
<h4>Truth table</h4>
<div class="twrap"><table class="trace" style="min-width:0"><tr><th>A</th><th>B</th><th>A and B</th><th>A or B</th><th>not A</th></tr>
<tr><td>True</td><td>True</td><td>True</td><td>True</td><td>False</td></tr><tr><td>True</td><td>False</td><td>False</td><td>True</td><td>False</td></tr>
<tr><td>False</td><td>True</td><td>False</td><td>True</td><td>True</td></tr><tr><td>False</td><td>False</td><td>False</td><td>False</td><td>True</td></tr></table></div>
${pre(`temp > 85                 # greater than 85
temp != 60                # not 60
temp >= 75                # at least 75
temp <= 100               # at most 100
temp < 60 and humidity >= 0.5
65 <= temp <= 75          # chained form works in Python (Barr: "not in most languages")`)}
<h4>Common mistakes</h4>
<ul class="gotcha"><li><code>=</code> assigns and <code>==</code> compares.</li><li><code>x == 1 or 2</code> is always True.</li><li><code>not</code> binds tighter than <code>and</code>/<code>or</code>: <code>not False or True</code> → True, but <code>not (False or True)</code> → False.</li><li>Strings are case-sensitive: <code>"xy" != "XY"</code> → True.</li></ul>
<h4>Worked example (Practice 2 Q1)</h4>
${pre(`3 < 4 and 4 < 5        # True  and True  -> True
3 < 4 or 4 < 3         # True  or  False -> True
-10 < 0 and 0 >= 10    # True  and False -> False
not False or True      # (not False) or True -> True`)}`};

L.ifs={title:'if / elif / else',src:'Week 3–4 · 171-06 If Statements · Practice 2–3 Q3 · flowcharts',html:`
${pre(`if score >= 10:          # 1 if
    print("Perfect")
elif score >= 7:         # 0 or more elif
    print("Okay")
else:                    # 0 or 1 else -- no condition
    print("Uh-oh")
print("program finished")  # not indented: always runs`)}
<p><b>Only ONE block of an if/elif/else chain runs</b>: the first one whose condition is True. A new <code>if</code> starts a new chain.</p>
<h4>Flowchart habit</h4>
<p>Draw each condition as a diamond with True and False arrows. For a chain, the False arrow leads to the next diamond, and the last False goes to the else. Practice 2–4 ask for this.</p>
<h4>Common mistakes</h4>
<ul class="gotcha"><li>Forgetting the <code>:</code> or the indentation.</li><li>Treating two separate <code>if</code>s as a chain (see the thermostat example in the quiz).</li><li>Getting the order wrong: if you check <code>&gt;= 60</code> before <code>&gt;= 90</code>, a 95 becomes a D.</li></ul>
<h4>Worked example (lecture 171-07 getGrade)</h4>
${pre(`def getGrade(score):
    '''
    Converts a 0-100 score to a letter grade
    :param score: a number 0-100
    :return: "A", "B", "C", "D" or "F"
    '''
    if score >= 90:
        return "A"
    elif score >= 80:     # only reached when score < 90
        return "B"
    elif score >= 70:
        return "C"
    elif score >= 60:
        return "D"
    else:
        return "F"
# getGrade(65) -> "D" ;  getGrade(90) -> "A" ; getGrade(89.9) -> "B"`)}`};

L.nested={title:'Nested if statements',src:'Week 4–5 · 171-08 Nested If · Practice 4 · Quiz 4',html:`
${pre(`if condition1:           # outer if
    if condition2:       # inner if: only reached when condition1 is True
        # do stuff
    else:
        # other stuff
else:
    # some other stuff`)}
<p><b>Nested vs compound:</b> <code>if a:</code> containing <code>if b:</code> is the same as <code>if a and b:</code>. Practice 4 Q4 says <b>"Do not use conjunctions!"</b>, so you must be able to write the nested form.</p>
<h4>How to evaluate by hand</h4>
<p>First find which OUTER branch you land in, then evaluate only that branch's inner if. Ignore everything else.</p>
<h4>Common mistakes</h4>
<ul class="gotcha"><li>Indenting the inner <code>else</code> at the wrong level, which pairs it with the wrong <code>if</code>.</li><li>Boundary values: in Practice 4 Q1, num = 10 goes to the <code>elif num &lt; 20</code> branch (10 &lt; 10 is False), and 10 &gt; 15 is False, so result = 11.</li></ul>
<h4>Worked example (Practice 4 Q1, num = 26)</h4>
${pre(`if num < 10:          # 26 < 10?  False -> skip this branch
    ...
elif num < 20:        # 26 < 20?  False -> skip
    ...
elif num < 30:        # 26 < 30?  True  -> enter
    if num > 25:      #   26 > 25? True
        result = 20   #   result = 20  <-- answer
    else:
        result = 21
else:
    result = 30
# num=-2 -> 1 | num=7.1 -> 0 | num=10 -> 11 | num=26 -> 20 | num=35 -> 30`)}`};

L.while={title:'while loops & the accumulator pattern',src:'Week 5–6 · 171-09 While Loops · Practice 5 · Quiz 5',html:`
${pre(`while <BOOLEAN_EXPRESSION>:
    # body: runs again and again while the condition is True

# accumulator pattern
total = 0                 # 1. initialize before the loop
i = 1
while i <= n:             # 2. condition checked at the TOP of each pass
    total = total + i     # 3. do some stuff
    i = i + 1             # 4. update, or it loops forever
print(total)              # 5. use the result after the loop`)}
<h4>Input validation (why while beats if)</h4>
${pre(`age = int(input('Enter your age in years: '))
while age < 0:
    age = int(input('Your age must be greater than 0.  Try again: '))`)}
<h4>break</h4><p><code>break</code> exits the loop immediately. Barr uses it in the guessing game.</p>
<h4>Common mistakes</h4>
<ul class="gotcha"><li>No update line, so the loop never ends.</li><li>Off-by-one: <code>&lt;</code> vs <code>&lt;=</code>. Count the passes with a trace.</li><li>Putting the update inside an <code>if</code>, so it doesn't always run.</li><li>Initializing the accumulator INSIDE the loop, which resets it every pass.</li></ul>
<h4>Worked example: sum 1..n</h4>
${pre(`def sum_to(n):
    total = 0
    i = 1
    while i <= n:
        total = total + i
        i = i + 1
    return total
# sum_to(4): total 0->1->3->6->10, i 1->2->3->4->5 (5 <= 4 False, stop) -> 10`)}`};

L.nestedwhile={title:'Nested while loops',src:'Week 6 · 171-09 (number box, triangle) · Practice 5 Q1',html:`
${pre(`a = 0
while a < 5:          # outer loop: rows
    b = 0             # RESET the inner counter on every outer pass
    while b < 5:      # inner loop: columns
        print(a, b)
        b = b + 1
    a = a + 1
print("done")`)}
<p>The inner loop runs <b>completely</b> on every pass of the outer loop. <code>print(x, end=" ")</code> stays on the same line, and <code>print("")</code> moves to the next line.</p>
<h4>Common mistakes</h4><ul class="gotcha"><li>Initializing <code>j = 1</code> outside the outer loop, so only the first row prints.</li><li>Putting the newline <code>print('')</code> inside the inner loop.</li></ul>
<h4>Worked example: number triangle (n = 3)</h4>
${pre(`def triangle(n):
    row = 1
    while row <= n:
        col = 1
        while col <= row:
            print(col, end=" ")
            col = col + 1
        print("")
        row = row + 1
# 1
# 1 2
# 1 2 3`)}`};

L.func={title:'Functions: parameters, arguments, return, main()',src:'Week 2–3 · 171-05 functions · 171-06 · Practice Midterm Q2',html:`
${pre(`def avg_3_nums(num1, num2, num3):     # header: def + name + PARAMETERS + :
    '''
    Returns average of 3 numbers        # docstring
    '''
    total = num1 + num2 + num3          # indented body
    avg = total / 3
    return avg                          # return statement: the output

def main():
    x = 10
    y = 20
    z = 30
    george = avg_3_nums(x, y, z)        # call with ARGUMENTS; store the return value
    print(george)                       # 20.0

main()    # the only line that runs immediately`)}
<p><b>Parameter</b> = the name in the def header. <b>Argument</b> = the value you pass in the call. A function only runs when it is <b>called</b>.</p>
<h4>Practice Midterm Q2 answer: main components of a function definition</h4>
<ul class="gotcha"><li>Header: <code>def</code>, the function name, parameters in parentheses, and a colon.</li><li>Docstring explaining the parameters and return value.</li><li>Indented body (the code).</li><li><code>return</code> statement that sends a value back to the caller.</li></ul>
<h4>Common mistakes</h4><ul class="gotcha"><li>Printing instead of returning: <code>x = add(2,3)</code> gives <code>None</code> if add only prints.</li><li>Calling a function but not storing the result.</li><li>Putting <code>input()</code> inside calculation functions; it belongs in main or a user function.</li></ul>`};

L.scope={title:'Scope, return values & the call stack',src:'Week 3 · Python scope tutorial (Week 3 module) · Practice Midterm Q4',html:`
<p>Every call gets its own <b>frame</b> with its own local variables. Parameters are local <b>copies</b> of the arguments. When the function returns, its frame and its variables disappear. That's why Barr calls it a <b>stack trace</b>.</p>
${pre(`def change(x):
    x = x - 1        # changes change's x only
    return x

n = 5
m = change(n)
print(n, m)          # 5 4   (n is untouched)

def setup():
    count = 5        # local to setup
setup()
print(count)         # NameError: count doesn't exist out here`)}
<h4>Common mistakes</h4><ul class="gotcha"><li>Assuming <code>boo(num2)</code> changes num2. It doesn't.</li><li>Counting a return value that was never stored: <code>bump(x)</code> on its own line throws its result away.</li><li>Missing that <code>x / 2</code> makes x a float: in Practice Midterm Q4, <code>foo(4)</code> returns <code>2.0</code>.</li></ul>
<h4>Worked example (Practice Midterm Q4)</h4>
${pre(`def boo(val):
    while val > 0:
        val = val - 1        # only boo's copy changes; prints nothing
def foo(x):
    if (x % 2) == 0:
        x = x / 2            # 4/2 = 2.0  (float!)
    else:
        x = x * 2
    boo(x)                   # result ignored, x unchanged
    return x
num1 = 4
num1 = foo(num1)             # 2.0
print(num1)                  # OUTPUT: 2.0
num2 = 2.5
boo(num2)                    # prints nothing
# Full output:  2.0`)}`};

L.design={title:'Design & top-down design',src:'Week 1–6 · 171-03/05 designs · 171-11 Top Down Design · Quiz 1',html:`
<h4>A design has 5 parts</h4>
${pre(`Client Request: How much will I actually pay for a discounted item (incl. sales tax)?
Inputs:  original price ($), discount %, tax %
Outputs: amount to pay
Examples:  $100, 10%, 5%  -> $94.5
           $20,  0%, 10%  -> $22
           $40, 10%,  0%  -> $36
Domain Knowledge: tax is taken on the SALE price; round to 2 decimal places
Algorithm:
  1. discount = price * (discount % / 100)
  2. sale price = price - discount
  3. tax = sale price * (tax % / 100)
  4. total = sale price + tax, rounded to 2 places`)}
<h4>Top-down design</h4>
<p>Start with the client statement, then design the high-level solution in <code>main</code>. <b>Each big step of the algorithm becomes a function</b>, and each function gets its own mini design (name, input/output, examples, domain knowledge, algorithm). Repeat until the pieces are small.</p>
<h4>Bottom-up coding rules (lecture 171-11)</h4>
<ul class="gotcha"><li>Short: no longer than 10 lines.</li><li>At most 3 levels of indentation.</li><li>Does one thing and only one thing.</li><li>Easy to test.</li><li>Only ever returns one data type.</li></ul>
<h4>Worked example: the design examples become your tests</h4>
<p>The 3–4 examples in a design are exactly the tests you write in TDD: argument values and the expected return value. Design inputs become parameters, outputs become the return value, the algorithm becomes the body, and each big algorithm step becomes a function.</p>`};

L.tdd={title:'Test Driven Design: Barr\'s format',src:'Week 6–7 · 171-11 TDD · Lab 5 skeleton · Lab 6 design · Practice 6 · Quiz 6',html:`
<p><b>Order:</b> 1) write the function stub (header, docstring, pass line), 2) write the test function, 3) implement the function, 4) use the tests to check it works.</p>
${pre(`def count_char(text, ch):
    '''
    Counts how many times a character appears in a string
    :param text: the string to search
    :param ch: a single character to look for (case-sensitive)
    :return: an int, the number of times ch occurs in text
    '''
    pass

def test_count_char():
    print("------------ test_count_char ------------")
    # typical case: character appears several times
    result = count_char("banana", "a")
    if result == 3:
        print("PASS")
    else:
        print("FAIL: expected 3, got", result)
    # edge case: empty string should give 0, not crash
    result = count_char("", "a")
    if result == 0:
        print("PASS")
    else:
        print("FAIL: expected 0, got", result)
    # case sensitivity: "B" is not "b", so the answer is 0
    result = count_char("Banana", "b")
    if result == 0:
        print("PASS")
    else:
        print("FAIL: expected 0, got", result)
    # character not in string at all
    result = count_char("apple", "z")
    if result == 0:
        print("PASS")
    else:
        print("FAIL: expected 0, got", result)

def main():
    test_count_char()

main()`)}
<p>With only the stub, the output is four FAIL lines because <code>pass</code> makes the function return <code>None</code>. That is exactly what the Lab 6 design asks for.</p>
<h4>Picking tests (at least 3, each with a comment saying WHY)</h4>
<ul class="gotcha"><li><b>Typical</b>: an ordinary value that should work.</li><li><b>Boundary</b>: the exact cut-off and one either side (89/90, 0, the first and last character).</li><li><b>Edge</b>: empty string <code>""</code>, 0, negatives, a single character, upper vs lower case, a value not found.</li><li>Cover <b>every outcome</b>: True AND False, or each letter grade.</li></ul>
<h4>Common mistakes</h4>
<ul class="gotcha"><li>Using <code>assert</code>, which Barr doesn't use.</li><li>Writing tests with no comment, or three tests of the same kind.</li><li>A test function that never prints PASS or FAIL.</li><li>Forgetting <code>main()</code> at the bottom, so nothing runs.</li><li><code>round(result, 2)</code> on a stub's None crashes. Choose exact expected values instead.</li><li>Putting <code>input()</code> in the function under test.</li></ul>
<p class="small muted">Barr's own Lab 5 skeleton prints <code>print("should be tie:", test_win)</code> under a header line rather than PASS/FAIL. Confirm with him which format he wants on paper; both use the same stub and comment layout.</p>`};

L.random={title:'The random library',src:'Week 5–6 · 171-09 · 171-11 · Lab 4 Craps · Lab 5 Rock-Paper-Scissors',html:`
${pre(`import random                  # top of the file

die = random.randint(1, 6)     # int from 1 to 6, BOTH ends included
roll = random.randint(1, 6) + random.randint(1, 6)   # two dice (NOT randint(2, 12))
f = random.random()            # float from 0.0 up to (not including) 1.0
pick = random.choice(["rock", "paper", "scissors"])

from random import randint     # the other import style
x = randint(0, 5)`)}
<h4>Testing random functions</h4>
<p>You can't predict the exact value, so test a <b>property</b>: call it many times and check every result is valid (in range, or one of the allowed strings).</p>
${pre(`def test_roll_die():
    print("------------ test_roll_die ------------")
    # property test: 100 rolls must all be between 1 and 6
    ok = True
    count = 0
    while count < 100:
        r = roll_die()
        if r == None or r < 1 or r > 6:
            ok = False
        count = count + 1
    if ok:
        print("PASS")
    else:
        print("FAIL: got a value outside 1-6")`)}
<h4>Simulation pattern (guessing game, average rolls)</h4>
${pre(`def rolls_until(target):
    count = 1
    roll = random.randint(1, 6) + random.randint(1, 6)
    while roll != target:
        roll = random.randint(1, 6) + random.randint(1, 6)
        count = count + 1
    return count`)}`};

L.strings={title:'Strings: indexing, slicing & methods',src:'Week 7–9 · 171-13 String Patterns · Practice 7 Q1–Q2 · Lab 6',html:`
<p>Barr's Practice 7 (Quiz 7 prep) asks you to read and write slices by hand. Lab 6 banned slices and methods <i>for that lab only</i>; on the quiz you may be asked to use them.</p>
${pre(`str1 = "Luke luck likes lakes"
#        0123456789...
#  L=0 u=1 k=2 e=3 ' '=4 l=5 u=6 c=7 k=8 ' '=9 l=10 i=11 k=12 e=13 s=14 ...
str1[10:]          # "likes lakes"   from 10 to the end
str1[:10]          # "Luke luck "    0..9 (ends with the space at 9)
str1[10:14]        # "like"          10, 11, 12, 13 (stop 14 excluded)
str1[5:10]         # "luck "
str1[10:14] + str1[5:10]   # "likeluck "  (+ joins with no space added)
str1[-1]           # "s"             last character
len(str1)          # 21              last index is 20`)}
<h4>Going the other way: write the slice that returns a piece</h4>
${pre(`s = "What does the fox say?"
#  W=0 h=1 a=2 t=3 ' '=4 d=5 o=6 e=7 s=8 ' '=9 ... s=18 a=19 y=20 ?=21
s[0]             # "W"
s[:4]            # "What"
s[5:9]           # "does"      stop = index AFTER the last letter you want
s[:5] + s[18:]   # "What say?"
s[-1]            # "?"   (s[21] also works)`)}
<h4>Built-in methods (lecture 171-13)</h4>
${pre(`myChars = "This is a set of characters."
myChars.find("s")         # 3   index of the FIRST match (-1 if none)
myChars.count("h")        # 2   case-sensitive
myChars.replace("a", "@") # "This is @ set of ch@r@cters."  (returns a NEW string)
"hi".upper()   "HI".lower()`)}
<h4>Common mistakes</h4><ul class="gotcha"><li>Forgetting that the stop index is excluded, so "does" is <code>s[5:9]</code>, not <code>s[5:8]</code>.</li><li>Forgetting to count spaces when numbering indexes.</li><li>Expecting a method to change the original string. Strings are immutable, so methods return a new one.</li><li><code>"abc"[3]</code> crashes with an IndexError, but the slice <code>"abc"[1:10]</code> just stops at the end.</li></ul>`};

L.forrange={title:'for loops & range',src:'Week 7–9 · 171-13 · Practice 7 Q3–Q4',html:`
${pre(`for num in range(0, 100, 7):   # 0 7 14 ... 98
    print(num)

for i in range(len(my_str)):   # by INDEX: use my_str[i]
    ...
for ch in my_str:              # by CHARACTER: no index available
    ...`)}
<h4>Practice 7 Q3: what range makes</h4>
<div class="twrap"><table class="trace" style="min-width:0"><tr><th>Command</th><th>Numbers</th><th>Why</th></tr>
<tr><td class="v">range(5)</td><td class="v">0 1 2 3 4</td><td class="n">start 0, stop before 5</td></tr>
<tr><td class="v">range(2, 7)</td><td class="v">2 3 4 5 6</td><td class="n">stop excluded</td></tr>
<tr><td class="v">range(1, 10, 2)</td><td class="v">1 3 5 7 9</td><td class="n">step 2</td></tr>
<tr><td class="v">range(3, 3)</td><td class="v">(empty)</td><td class="n">already at the stop</td></tr>
<tr><td class="v">range(10, 1, -2)</td><td class="v">10 8 6 4 2</td><td class="n">negative step counts down, still stops before 1</td></tr>
<tr><td class="v">range(10, 1, 2)</td><td class="v">(empty)</td><td class="n">counting up can never reach 1</td></tr></table></div>
<h4>Practice 7 Q4: write the range</h4>
${pre(`0, 1, 2, 3        -> range(4)
1, 2, 3, 4        -> range(1, 5)
1, 3, 5, 7        -> range(1, 8, 2)      (any stop 8 or 9 works)
2, 4, 6, 8        -> range(2, 9, 2)      (or range(2, 10, 2))
-4, -3, -2, -1    -> range(-4, 0)
-1, -2, -3, -4    -> range(-1, -5, -1)`)}
<p><b>Recipe:</b> start = the first number, step = the gap (negative if going down), stop = one step PAST the last number.</p>
<h4>for vs while (lecture 171-13)</h4>
${pre(`for num in range(5):      |   num = 0
    print(num)            |   while num < 5:
                          |       print(num)
                          |       num = num + 1`)}
<h4>Common mistakes</h4><ul class="gotcha"><li>Expecting range(1, 5) to include 5.</li><li>Writing a positive step when counting down, which gives an empty range.</li><li>Using <code>for ch in s</code> when you need the index (e.g. "every even index").</li></ul>`};

L.ascii={title:'Unicode, ASCII, ord() & chr()',src:'Week 9 · 171-13 String Patterns & Unicode · Lab 7 (encryption)',html:`
<p>Computers only store numbers, so every character is assigned a number. ASCII (1960s) covers 128 Latin characters; Unicode is the modern version with every script and emoji. Python gives you two functions to move between them.</p>
${pre(`ord('a')            # 97    character -> its code number
chr(97)             # 'a'   code number -> character
chr(ord("a") + 3)   # 'd'   shift by 3 (the Lab 7 cipher idea)

# codes to know (lecture 171-13)
# 'A' = 65 ... 'Z' = 90
# 'a' = 97 ... 'z' = 122      lowercase = uppercase + 32
# ' ' = 32   '!' = 33`)}
<h4>Using codes in conditions</h4>
${pre(`if 97 <= ord(ch) <= 122:       # ch is a lowercase letter
if 65 <= ord(ch) <= 90:        # ch is an uppercase letter
upper = chr(ord(ch) - 32)      # lowercase -> uppercase
lower = chr(ord(ch) + 32)      # uppercase -> lowercase`)}
<h4>Shift cipher (Lab 7 idea)</h4>
${pre(`encoded = chr(ord("H") + 3)    # 'K'   72 + 3 = 75
decoded = chr(ord("K") - 3)    # 'H'   decoding = shifting back by the key
chr(ord('z') + 1)              # '{'   a plain shift does NOT wrap around to 'a'`)}
<h4>Common mistakes</h4><ul class="gotcha"><li>Mixing up the direction: <code>ord</code> takes a character, <code>chr</code> takes an int.</li><li><code>ord("ab")</code> crashes because it takes exactly one character.</li><li>Comparing <code>ord(ch)</code> with a letter (<code>ord(ch) == 'a'</code>) instead of a number.</li><li>Forgetting that non-letters (spaces, digits, punctuation) have codes too, so <code>chr(ord(" ") + 3)</code> is <code>'#'</code>.</li></ul>`};

L.patterns={title:'String patterns: accumulator & early return',src:'Week 9 · 171-13 (Programming/Design Patterns) · Practice 7 Q5',html:`
<p>Barr names two patterns for working through a string. Almost every string function on a quiz is one of these.</p>
<h4>1. String accumulator (build a new string)</h4>
${pre(`new_string = ""                      # 1. start empty, BEFORE the loop
for i in range(len(some_string)):
    ch = some_string[i]
    if some condition about ch:
        new_string = new_string + something    # 2. add to it
    else:
        new_string = new_string + ch
return new_string                    # 3. use it AFTER the loop`)}
<p>Counting uses the same shape with a number: <code>count = 0</code> before the loop, <code>count = count + 1</code> inside.</p>
<h4>2. Early return (search for something)</h4>
${pre(`def contains_at(text):
    for ch in text:
        if ch == "@":
            return True      # found it: leave the function right now
    return False             # only reached if the loop never found one`)}
<h4>Worked example: hide_letter (lecture 171-13)</h4>
${pre(`def hide_letter(text, letter):
    new_str = ""
    for i in range(len(text)):
        ch = text[i]
        if ch == letter:
            new_str = new_str + "-"
        else:
            new_str = new_str + ch
    return new_str
# hide_letter("Honey Badger", "e")  ->  "Hon-y Badg-r"`)}
<h4>Worked example: Practice 7 Q5 (capitalize even indexes)</h4>
${pre(`def cap_even(text):
    result = ""
    for i in range(len(text)):       # need the INDEX, so range(len(...))
        if i % 2 == 0:
            result = result + text[i].upper()
        else:
            result = result + text[i]
    return result
# cap_even("ithaca")  ->  "ItHaCa"`)}
<h4>Common mistakes</h4><ul class="gotcha"><li>Putting <code>new_str = ""</code> INSIDE the loop, which resets it on every pass.</li><li>Putting <code>return</code> inside the loop for an accumulator, which stops after one character.</li><li>Writing <code>else: return False</code> inside the search loop, which gives up after the first character.</li><li>Writing <code>new_str + ch</code> without the <code>new_str =</code>, so nothing is stored.</li></ul>`};
L.lists={title:'Lists: indexing, slicing, methods & mutation',src:'Week 10 · Python Lists tutorial · Python for Everybody ch. 8 (Lists)',html:`
<p>A list holds several values in order, in square brackets: <code>nums = [4, 8, 15]</code>. Indexing, slicing, <code>len()</code>, <code>in</code> and <code>for</code> work just like they do on strings. The big difference: <b>a list can be changed in place</b>. A string can't.</p>
${pre(`nums = [4, 8, 15, 16, 23, 42]
nums[0]        # 4      first item (index 0)
nums[-1]       # 42     last item
nums[1:3]      # [8, 15]  slice: start included, stop excluded
len(nums)      # 6
15 in nums     # True
nums[0] = 99   # OK: lists are mutable (s[0] = "x" on a string is a TypeError)`)}
<h4>Methods you need</h4>
<div class="twrap"><table class="trace" style="min-width:0"><tr><th>Call</th><th>What it does</th><th>Returns</th></tr>
<tr><td class="v">lst.append(x)</td><td class="n">adds x to the end</td><td class="v">None</td></tr>
<tr><td class="v">lst.insert(i, x)</td><td class="n">puts x at index i, shifting the rest right</td><td class="v">None</td></tr>
<tr><td class="v">lst.pop()</td><td class="n">removes the last item</td><td class="v">that item</td></tr>
<tr><td class="v">lst.pop(i)</td><td class="n">removes the item at index i</td><td class="v">that item</td></tr>
<tr><td class="v">lst.remove(x)</td><td class="n">removes the FIRST x (ValueError if x isn't there)</td><td class="v">None</td></tr>
<tr><td class="v">lst.sort()</td><td class="n">sorts the list itself</td><td class="v">None</td></tr>
<tr><td class="v">sorted(lst)</td><td class="n">makes a NEW sorted list; lst is unchanged</td><td class="v">new list</td></tr>
<tr><td class="v">lst.count(x) / lst.index(x)</td><td class="n">how many x / index of the first x</td><td class="v">int</td></tr>
<tr><td class="v">sum(lst), max(lst), min(lst)</td><td class="n">built-in functions for number lists</td><td class="v">number</td></tr>
<tr><td class="v">text.split(",")</td><td class="n">cuts a string into a list of strings</td><td class="v">list of str</td></tr></table></div>
<h4>The three loop patterns (same as strings)</h4>
${pre(`for x in nums:                 # by ITEM: no index
    total = total + x

for i in range(len(nums)):     # by INDEX: needed to CHANGE items
    nums[i] = nums[i] * 2

result = []                    # BUILD a new list
for x in nums:
    if x > 10:
        result.append(x)`)}
<h4>Aliasing and functions: the exam trap</h4>
${pre(`a = [1, 2, 3]
b = a            # NOT a copy: two names, one list
b.append(4)
print(a)         # [1, 2, 3, 4]

def add_bonus(scores):
    for i in range(len(scores)):
        scores[i] = scores[i] + 5

marks = [70, 80]
add_bonus(marks)
print(marks)     # [75, 85]  the caller's list changed`)}
<p>This is the opposite of what you learned for ints: an int parameter is a copy, so changing it inside a function does nothing to the caller. A <b>list</b> parameter is the same list, so <code>append</code>, <code>remove</code> and <code>lst[i] = …</code> inside the function change the caller's list.</p>
<h4>Common mistakes</h4><ul class="gotcha">
<li><code>nums = nums.sort()</code> sets nums to None. Use <code>nums.sort()</code> on its own line, or <code>nums = sorted(nums)</code>.</li>
<li><code>nums[len(nums)]</code> is an IndexError: the last index is <code>len(nums) - 1</code> (or just <code>-1</code>).</li>
<li><code>nums[3] = 4</code> on a 3-item list does not add an item; use <code>append</code>.</li>
<li><code>for x in nums: x = x * 2</code> does NOT change the list. Loop by index to change items.</li>
<li>Forgetting the empty list: <code>max([])</code> crashes and <code>total / len(lst)</code> divides by zero. Test with <code>[]</code>.</li></ul>`};

  const an=o['is_anagram']; const sh={}; Object.entries(an.lines).forEach(([k,v])=>sh[+k+7]=v); sh[0]='Your count_char from earlier in Lab 6 (its steps are hidden here).'; an.lines=sh;
  const B=FXNEW.filter(x=>x.g.startsWith('Built')), C=FXNEW.filter(x=>x.g.startsWith('Functions'));
  return [...B,...['show_indexes','show_chars','build_copy','every_other','shift'].map(k=>o[k]),...C,...['reverse_string','count_char','remove_all','remove_first','is_palindrome','is_anagram'].map(k=>o[k])];})();

  $('#main').innerHTML=`<div class="stack fade">

function drawFx(m,d,run){
  const st=run.steps[FXSTEP], prev=FXSTEP?run.steps[FXSTEP-1]:null;
  const stack=st.s||[];
  $('#fxcode').innerHTML=`<pre class="code" style="padding:8px 0">${d.src.split('\n').map((l,i)=>`<div style="padding:1px 12px;${i===st.l?'background:var(--pencil-soft);box-shadow:inset 3px 0 0 var(--pencil)':''}"><span style="color:var(--c);display:inline-block;width:24px">${i+1}</span>${hl(l)}</div>`).join('')}</pre>`;
  $('#fxcount').textContent=`step ${FXSTEP+1} / ${run.steps.length}`; $('#fxslider').value=FXSTEP;
  let strip='';
  if(m.strip){const sv=m.strip[0], ptrs=m.strip[1]; const fr=[...stack].reverse().find(f=>f.v[sv]!==undefined); let sval=null;
    if(fr){try{sval=JSON.parse(fr.v[sv].replace(/^'(.*)'$/,(a,b)=>'"'+b.replace(/"/g,'\\"')+'"'));}catch(e){}}
    if(sval===null){const a=run.call.match(/\("([^"]*)"/); sval=a?a[1]:'';}
    const pv={}; if(fr) ptrs.forEach(p=>{if(fr.v[p]!==undefined)pv[p]=+fr.v[p];});
    const cells=[...sval].map((c,i)=>{const here=Object.entries(pv).filter(([k,v])=>v===i).map(([k])=>k);return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px"><span class="small muted mono">${i}</span><span class="mono" style="min-width:30px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid ${here.length?'var(--accent)':'var(--line)'};background:${here.length?'var(--accent-soft)':'var(--paper)'};border-radius:5px;font-size:15px;font-weight:600">${c===' '?'␣':esc(c)}</span><span class="small mono" style="color:var(--accent);height:16px">${here.join(',')}</span></div>`;}).join('');
    strip=`<h4 style="margin-top:0">${esc(sv)} with its indexes</h4>${sval.length?`<div style="display:flex;gap:4px;flex-wrap:wrap">${cells}</div>`:'<p class="muted small">(empty string: no characters, so no indexes)</p>'}`;}
  const frames=stack.map((f,idx)=>{const pf=prev&&prev.s&&prev.s[idx]&&prev.s[idx].f===f.f?prev.s[idx]:null;
    const rows=Object.entries(f.v).map(([k,v])=>{const ch=pf&&pf.v[k]!==v;return `<tr><td class="fr">${esc(k)}</td><td class="v" style="${ch?'background:var(--pencil-soft)':''}">${esc(v)}${ch?' <span class="small muted">changed</span>':''}</td></tr>`;}).join('');
    const isTop=idx===stack.length-1;
    return `<div style="border:1px solid ${isTop?'var(--accent)':'var(--line)'};border-radius:8px;overflow:hidden"><div class="small" style="padding:5px 10px;background:${isTop?'var(--accent-soft)':'var(--paper)'};font-weight:600"><span class="mono">${esc(f.f)}()</span> <span class="muted">${isTop?'· running now':'· waiting for the call above to return'}</span></div><table class="trace" style="min-width:0"><tbody>${rows||'<tr><td class="muted small">no variables yet</td></tr>'}</tbody></table></div>`;}).reverse().join('');
  const when=st.done?'when it returns':(st.r!==undefined?'as '+esc(st.rf)+'() returns':'before line '+(st.l+1)+' runs');
  $('#fxviz').innerHTML=`${strip}
   <h4>${stack.length>1?'Call stack (top = running now)':'Variables'} ${when}</h4><div class="stack" style="gap:8px">${frames}</div>
   ${st.o?`<h4>Printed so far</h4><pre class="code">${esc(st.o)}</pre>`:''}
   ${st.r!==undefined&&!st.done?`<div class="verdict ok"><strong class="ok">${esc(st.rf)}() returns ${esc(st.r)}</strong> to the line that called it.</div>`:''}
   ${st.done?`<div class="verdict ok"><strong class="ok">Returns ${esc(st.r)}</strong>${st.r==='None'?' (no return statement, so the function returns None)':''}</div>`:''}`;
}

function rubricCheck(x,src){
  const n=x.name; const lines=src.split('\n');
  const tf=src.split(new RegExp('def\\s+test_'+n+'\\s*\\('))[1]||''; const tbody=tf.split(/\ndef\s/)[0];
  const stub=(src.split(new RegExp('def\\s+'+n+'\\s*\\('))[1]||'').split(/\ndef\s/)[0];
  const calls=(tbody.match(new RegExp('\\b'+n+'\\s*\\(','g'))||[]).length;
  const comments=(tbody.match(/^\s*#\s*\S+/gm)||[]).length;
  const C=[
   [new RegExp('^def\\s+'+n+'\\s*\\([^)]*\\)\\s*:','m').test(src),`Header: def ${n}(…): with parameters and a colon`],
   [/'''|"""/.test(stub),'Docstring inside the stub'],
   [/return/i.test((stub.match(/('''|""")[\s\S]*?('''|""")/)||[''])[0]),'Docstring explains the return value (:return:)'],
   [/^\s+pass\s*$/m.test(stub),'Stub body is pass'],
   [new RegExp('^def\\s+test_'+n+'\\s*\\(\\s*\\)\\s*:','m').test(src),`Test function: def test_${n}():`],
   [calls>=3,`At least 3 calls to ${n}(…) in the test function (found ${calls})`],
   [comments>=3,`A comment on each test (found ${comments})`],
   [/PASS/.test(tbody)&&/FAIL/.test(tbody),'Tests print PASS and FAIL'],
   [!/\bassert\b/.test(src),'No assert (Barr doesn\'t use it)'],
   [/^def\s+main\s*\(\s*\)\s*:/m.test(src)&&new RegExp('^\\s+test_'+n+'\\s*\\(\\s*\\)','m').test(src.split(/^def\s+main/m)[1]||''),`main() calls test_${n}()`],
   [/^main\s*\(\s*\)\s*$/m.test(src),'main() is called on its own line at the bottom'],
   [!/round\s*\(\s*result/.test(tbody),'No round(result…) on a stub\'s None']];
  return C;
}

    <div class="seg"><button aria-pressed="${Q.mode==='adaptive'}" data-m="adaptive">Everything</button><button aria-pressed="${Q.mode==='unit'}" data-m="unit">One week</button><button aria-pressed="${Q.mode==='topic'}" data-m="topic">One topic</button></div>
    ${Q.mode==='topic'?`<select id="qtopic" style="width:auto" aria-label="topic">${TOPICS.map(([k,n])=>`<option value="${k}" ${k===Q.topic?'selected':''}>${n}</option>`).join('')}</select>`:''}
    ${Q.mode==='unit'?`<select id="qunit" style="width:auto" aria-label="week">${UNITS.map(u=>`<option value="${u.wk}" ${u.wk===Q.unit?'selected':''}>Week ${u.wk}: ${esc(u.title)}</option>`).join('')}</select>`:''}
   </div>
   <div class="scoreline" style="margin-top:10px"><span>Session <b>${Q.sess.r}/${Q.sess.r+Q.sess.w}</b></span>${Q.mode!=='topic'?`<span>Level <b>${Q.level}</b> of 3</span><span>Streak <b>${Q.streak}</b></span>`:''}<span>Weak: <b>${st.filter(s=>s.weak).map(s=>s.n).join(', ')||'none yet'}</b></span></div></section>
  ${q?`<section class="sheet qcard" id="qcard">
   <div class="qmeta"><span class="pill">${TNAME[q.t]}</span><span class="pill lvl">${'●'.repeat(q.d)}${'○'.repeat(3-q.d)} level ${q.d}</span>${Q.lastWrong&&q.t===Q.lastWrong.t?'<span class="pill off">similar question</span>':''}</div>
   <div class="qtext ${/\n/.test(q.q)&&q.k!=='mc'?'':''}">${fmtQ(q.q)}</div>
   ${q.code?pre(q.code):''}
   ${q.k==='mc'?`<div class="choices">${q.ch.map((c,i)=>`<button data-c="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(c)}</span></button>`).join('')}</div>`:
     q.k==='short'?`<input type="text" id="qin" placeholder="Your answer" autocomplete="off" spellcheck="false">`:
     `<textarea id="qin" rows="${Math.min(8,Math.max(3,q.a.split('\n').length+1))}" placeholder="Type the exact output, one printed line per line" spellcheck="false"></textarea>`}
   <div class="row"><button class="btn primary" id="qsubmit">Check answer</button><button class="btn ghost" id="qskip">Skip</button><span class="small muted">Enter to submit</span></div>
   <div id="qfb"></div></section>`:'<section class="sheet">No questions match these filters.</section>'}</div>`;
  $$('.seg button').forEach(b=>b.onclick=()=>{Q.mode=b.dataset.m;if(Q.mode==='topic'&&!Q.topic)Q.topic='types';if(Q.mode==='unit'&&!Q.unit)Q.unit=UNITS[UNITS.length-1].wk;Q.cur=null;Q.lastWrong=null;R.quiz();});
  const su=$('#qunit'); if(su) su.onchange=()=>{Q.unit=+su.value;Q.cur=null;Q.lastWrong=null;Q.level=1;Q.streak=0;R.quiz();};
  const sel=$('#qtopic'); if(sel) sel.onchange=()=>{Q.topic=sel.value;Q.cur=null;Q.lastWrong=null;R.quiz();};
  if(!q) return;
  let pick=null;
  $$('.choices button').forEach(b=>b.onclick=()=>{if(Q.answered)return;$$('.choices button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');pick=+b.dataset.c;});
  const inp=$('#qin'); if(inp){inp.focus();inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&(q.k==='short'||e.metaKey||e.ctrlKey)){e.preventDefault();$('#qsubmit').click();}});}
  $('#qskip').onclick=()=>{Q.seen.add(q.id);Q.cur=null;Q.lastWrong=null;R.quiz();};
  $('#qsubmit').onclick=()=>{
    if(Q.answered){Q.cur=null;R.quiz();return;}
    let right,user,correct;
    if(q.k==='mc'){if(pick===null){toast('Pick an answer first');return;}right=pick===q.a;user=q.ch[pick];correct=q.ch[q.a];
      $$('.choices button').forEach((b,i)=>{if(i===q.a)b.classList.add('right');else if(i===pick)b.classList.add('wrong');});}
    else{user=inp.value;if(!user.trim()){toast('Type an answer first');return;}correct=q.a;
      right=q.k==='short'?(normAns(user)===normAns(q.a)||(q.acc||[]).some(a=>normAns(a)===normAns(user))):normOut(user)===normOut(q.a);}
    Q.answered=true;Q.seen.add(q.id);
    const s=S.stats[q.t]||(S.stats[q.t]={r:0,w:0}); right?s.r++:s.w++; save();
    if(right){Q.sess.r++;Q.streak++;Q.lastWrong=null;if(Q.mode==='adaptive'&&Q.streak>=3&&Q.level<3){Q.level++;Q.streak=0;}}
    else{Q.sess.w++;Q.streak=0;Q.lastWrong=q;}
    const why=right?'':diagnose(q,user);
    $('#qfb').innerHTML=`<div class="verdict ${right?'ok':'bad'} fade"><strong class="${right?'ok':'bad'}">${right?'Correct.':'Not quite.'}</strong>
     ${right?'':`<div style="margin-top:6px"><span class="small muted">Your answer</span><pre class="code" style="margin:2px 0 6px">${esc(user)}</pre><span class="small muted">Correct answer</span><pre class="code" style="margin:2px 0 6px">${esc(correct)}</pre></div>`}
     ${why?`<p><b>What went wrong:</b> ${esc(why)}</p>`:''}<p style="margin:0">${esc(q.ex)}</p>
     ${right?'':`<p class="small" style="margin:8px 0 0">Next up is a similar question. If this topic stays shaky, <a href="#" data-go="learn:${q.t}">re-read ${TNAME[q.t]}</a>.</p>`}</div>`;
    $('#qsubmit').textContent='Next question →'; $('#qskip').hidden=true; if(inp) inp.readOnly=true;
    $('#qsubmit').focus();
  };
}
function fmtQ(t){const parts=t.split('\n\n');return parts.map(p=>/\n/.test(p)||/^(if|while|def|for|[a-z_]+\s*=)/.test(p)&&p.length<400&&/[=():]/.test(p)&&!/[?]$/.test(p.trim())?pre(p):`<p style="margin:0 0 6px">${esc(p)}</p>`).join('');}

/* ---------- EXAMS ---------- */
const TIMERS={};
function exState(k){return S.exams[k]||(S.exams[k]={a:{},score:{},graded:false,left:EX[k].minutes*60});}
function renderExam(k){
  const E=EX[k], st=exState(k);
  $('#main').innerHTML=`<div class="stack fade">
  <section class="sheet"><div class="row" style="margin-bottom:8px"><button class="btn ghost" data-go="exams">← All exams</button></div><h2>${E.title}</h2><p class="lede">${E.note}</p></section>
  <section class="sheet examhead"><div><div class="timer" id="tm">${fmtT(st.left)}</div><span class="small muted">${E.minutes}-minute timer · ${E.parts.reduce((a,p)=>a+p.pts,0)} points</span></div>
   <div class="row"><button class="btn primary" id="tmgo">${TIMERS[k]?'Pause':'Start timer'}</button><button class="btn ghost" id="tmreset">Reset</button>
   <button class="btn" id="exgrade">${st.graded?'Re-grade':'Finish & grade'}</button></div></section>
  ${E.parts.map((p,pi)=>partHTML(k,p,pi,st)).join('')}
  <section class="sheet" id="exsum">${st.graded?summaryHTML(k):'<p class="muted" style="margin:0">Press <b>Finish & grade</b> when you\'re done. Parts 1, 3 and 4 are auto-checked. For parts 2, 5 and 6 you compare against the model answer and rubric and enter your own score.</p>'}</section></div>`;
  $$('[data-ans]').forEach(el=>el.addEventListener('input',()=>{st.a[el.dataset.ans]=el.value;save();}));
  $$('[data-score]').forEach(el=>el.addEventListener('input',()=>{st.score[el.dataset.score]=el.value;save();$('#exsum').innerHTML=summaryHTML(k);}));
  $$('textarea[data-ans]').forEach(ta=>ta.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();ta.setRangeText('    ',ta.selectionStart,ta.selectionEnd,'end');st.a[ta.dataset.ans]=ta.value;save();}}));
  $('#tmgo').onclick=()=>{if(TIMERS[k]){clearInterval(TIMERS[k]);TIMERS[k]=null;$('#tmgo').textContent='Resume';}else{TIMERS[k]=setInterval(()=>{st.left=Math.max(0,st.left-1);save();const t=$('#tm');if(t&&TAB===k){t.textContent=fmtT(st.left);t.classList.toggle('low',st.left<300);}if(st.left===0){clearInterval(TIMERS[k]);TIMERS[k]=null;toast("Time's up: pens down");}},1000);$('#tmgo').textContent='Pause';}};
  $('#tmreset').onclick=()=>{clearInterval(TIMERS[k]);TIMERS[k]=null;st.left=E.minutes*60;save();renderExam(k);};
  $('#exgrade').onclick=()=>{autoGrade(k);st.graded=true;save();renderExam(k);$('#exsum').scrollIntoView({behavior:'smooth'});};
}
function fmtT(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function partHTML(k,p,pi,st){
  const g=st.graded, id=k+'-'+pi;
  let body='';
  if(p.type==='expr'){
    body=`<p class="small muted">Assume these assignments (and <code>import math</code>):</p>${pre(p.setup)}<div class="twrap"><table class="expr"><thead><tr><th>Expression</th><th>Value</th><th>Type</th>${g?'<th>Key</th>':''}</tr></thead><tbody>${p.rows.map((r,ri)=>{
      const v=st.a[id+'-v'+ri]||'',t=st.a[id+'-t'+ri]||''; const vo=normAns(v)===normAns(r[1]), to=typeOk(t,r[2]);
      return `<tr><td>${esc(r[0])}</td><td><input type="text" data-ans="${id}-v${ri}" value="${esc(v)}" class="${g?(vo?'ok':'bad'):''}" autocomplete="off" spellcheck="false" aria-label="value"></td><td><input type="text" data-ans="${id}-t${ri}" value="${esc(t)}" class="${g?(to?'ok':'bad'):''}" autocomplete="off" spellcheck="false" aria-label="type"></td>${g?`<td class="mono small">${esc(r[1])} · ${r[2]}</td>`:''}</tr>`;}).join('')}</tbody></table></div>`;
  } else {
    body=`${p.prompt?`<p>${esc(p.prompt)}</p>`:''}${p.code?pre(p.code):''}
    <textarea rows="${p.type==='output'?5:10}" data-ans="${id}" spellcheck="false" placeholder="${p.type==='output'?'Final output, one printed line per line (do the trace table on paper)':'Your answer'}">${esc(st.a[id]||'')}</textarea>
    ${g?`<div class="key" style="margin-top:10px">${p.type==='output'?`<p style="margin:0 0 4px"><b class="${normOut(st.a[id]||'')===normOut(p.answer)?'ok':'bad'}">${normOut(st.a[id]||'')===normOut(p.answer)?'✓ Output matches':'✗ Output does not match'}</b></p>`:''}<b>Model answer</b>${pre(p.model)}<b>Rubric</b><ul class="rubric">${p.rubric.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
      <div class="selfscore" style="margin-top:8px"><label for="sc-${id}">Your score</label><input type="text" inputmode="decimal" id="sc-${id}" data-score="${id}" value="${esc(st.score[id]??'')}"> / ${p.pts}</div></div>`:''}`;
  }
  return `<section class="sheet"><div class="qhead"><h3>${p.n}) ${esc(p.title)}</h3><span class="pts">[${p.pts} pts]</span></div>${body}</section>`;
}
function typeOk(u,t){u=normAns(u);const m={int:['int','integer'],float:['float','floating point','decimal'],bool:['bool','boolean'],str:['str','string']};return (m[t]||[t]).includes(u);}
function autoGrade(k){const E=EX[k],st=exState(k);E.parts.forEach((p,pi)=>{const id=k+'-'+pi;
  if(p.type==='expr'){let s=0;p.rows.forEach((r,ri)=>{if(normAns(st.a[id+'-v'+ri]||'')===normAns(r[1]))s+=.5;if(typeOk(st.a[id+'-t'+ri]||'',r[2]))s+=.5;});st.score[id]=s;}
  else if(p.type==='output'&&st.score[id]===undefined){st.score[id]=normOut(st.a[id]||'')===normOut(p.answer)?p.pts:0;}});}
function summaryHTML(k){const E=EX[k],st=exState(k);let tot=0;const rows=E.parts.map((p,pi)=>{const v=parseFloat(st.score[k+'-'+pi]);const s=isNaN(v)?null:Math.min(v,p.pts);if(s!=null)tot+=s;return {p,s};});
  const review=rows.filter(r=>r.s==null||r.s/r.p.pts<.7);
  return `<h3>Score</h3><div class="row" style="align-items:baseline;gap:12px;margin:6px 0 10px"><span class="total">${tot}</span><span class="muted">/ ${E.parts.reduce((a,p)=>a+p.pts,0)} · ${Math.round(100*tot/E.parts.reduce((a,p)=>a+p.pts,0))}%</span></div>
  ${rows.map(r=>`<div class="statrow"><span class="lbl">Q${r.p.n} ${TNAME[r.p.topic]}</span><div class="bar"><i style="width:${r.s==null?0:100*r.s/r.p.pts}%;${r.s!=null&&r.s/r.p.pts<.7?'background:var(--fail)':''}"></i></div><span class="num">${r.s==null?'score?':r.s+'/'+r.p.pts}</span></div>`).join('')}
  <h4>What to review</h4>${review.length?`<ul class="gotcha">${review.map(r=>`<li>Q${r.p.n} (${esc(r.p.title)}): ${r.s==null?'enter your self-score above. ':''}re-read <a href="#" data-go="learn:${r.p.topic}">${TNAME[r.p.topic]}</a>${r.p.type==='output'?', then redo a <a href="#" data-go="trace">trace</a>':r.p.topic==='tdd'?', then do two <a href="#" data-go="tdd">TDD Lab</a> exercises':''}.</li>`).join('')}</ul>`:'<p class="ok"><b>Every part is at 70% or above.</b> Spend your remaining time on the adaptive quiz.</p>'}`;}
EX.final={"title": "Mock Final (cumulative, 100 points)", "minutes": 150, "note": "New questions covering every unit through lists, built from the format of Barr's practice midterm. The syllabus says the final has \"similar questions to quizzes, there will simply be more of them\" and runs 2.5 hours. This mock is my estimate of that format, not Barr's paper. Answers to parts 1, 3, 4, 5 and 6 were checked by running the code. Suggested sittings: parts 1–4, then 5–7, then 8–10 (about 50 minutes each). In the last week before Dec 10, do one straight 2.5-hour run.", "parts": [{"type": "expr", "n": "1", "title": "Expressions and Data Types", "pts": 14, "topic": "ops", "setup": "a = 9\nb = 2.0\ns = \"Python\"\nnums = [3, 7, 1]\nc = a // 4", "rows": [["a / b", "4.5", "float"], ["a % 4", "1", "int"], ["c", "2", "int"], ["c * b", "4.0", "float"], ["round(a / 2)", "4", "int"], ["math.floor(a / b)", "4", "int"], ["s[1:4]", "yth", "str"], ["s[-1]", "n", "str"], ["len(s) + c", "8", "int"], ["nums[1] > nums[0] and a < 5", "False", "bool"], ["not (c == 2)", "False", "bool"], ["str(c) + s[0]", "2P", "str"], ["nums + [c]", "[3, 7, 1, 2]", "list"], ["int(b) * nums[2]", "2", "int"]]}, {"type": "free", "n": "2", "title": "Name the three parts of a function stub, and say why tests are written BEFORE the body.", "pts": 6, "topic": "tdd", "model": "1. Header: def, the function name, the parameters and a colon.\n2. Docstring: what the function does, each parameter, and what it returns.\n3. pass: a placeholder body so the file still runs.\nWhy tests first: writing tests forces you to decide exactly what the function must return for typical, boundary and edge inputs before you code it. Running them against the stub shows FAIL, so you know the tests can catch a wrong answer.", "rubric": ["1 pt per stub part (3)", "3 pts for the reason: decide expected results first, and tests that fail on the stub prove they can catch errors"]}, {"type": "output", "n": "3", "title": "Trace the following program (trace table + output)", "pts": 8, "topic": "while", "code": "def shrink(n, k):\n    count = 0\n    while n > k:\n        if n % k == 0:\n            n = n // k\n        else:\n            n = n - 3\n        count = count + 1\n    return count\n\ndef main():\n    x = 40\n    y = 4\n    r = shrink(x, y)\n    print(\"count:\", r, \"x:\", x)\n\nmain()", "answer": "count: 3 x: 40", "model": "n: 40 -> 10 -> 7 -> 4   count: 0 -> 1 -> 2 -> 3\n40%4=0 -> 40//4=10 | 10%4=2 -> 10-3=7 | 7%4=3 -> 7-3=4 | 4>4 False, stop\nOutput: count: 3 x: 40   (x in main is untouched)", "rubric": ["4 pts trace table", "2 pts count = 3", "2 pts x: 40"]}, {"type": "output", "n": "4", "title": "Code understanding: what are the outputs?", "pts": 8, "topic": "scope", "code": "def double_it(val):\n    val = val * 2\n    print(\"in double_it:\", val)\n\ndef boost(lst):\n    lst.append(len(lst))\n\nnum = 5\ndouble_it(num)\nprint(num)\ndata = [1, 2]\nboost(data)\nboost(data)\nprint(data)", "answer": "in double_it: 10\n5\n[1, 2, 2, 3]", "model": "double_it(5) prints 'in double_it: 10' but the int parameter is a COPY, so num is still 5.\nboost(data) changes the SAME list: [1, 2] -> [1, 2, 2] -> [1, 2, 2, 3] (len is 2, then 3).", "rubric": ["2 pts per correct line, in the right order (3 lines = 6)", "2 pts for showing the list was changed by the function but the int was not"]}, {"type": "output", "n": "5", "title": "Strings and for loops: what is printed?", "pts": 8, "topic": "forrange", "code": "def code_word(word):\n    result = \"\"\n    for i in range(len(word)):\n        if i % 2 == 0:\n            result = result + word[i].upper()\n        else:\n            result = result + word[i]\n    return result\n\nprint(code_word(\"ithaca\"))\nprint(code_word(\"cs\"))", "answer": "ItHaCa\nCs", "model": "Even INDEXES (0, 2, 4) are upper-cased: i-t-h-a-c-a -> I t H a C a = ItHaCa\n\"cs\": index 0 upper -> C, index 1 stays s = Cs", "rubric": ["4 pts per line"]}, {"type": "output", "n": "6", "title": "Lists: what is printed?", "pts": 8, "topic": "lists", "code": "def mystery(lst):\n    total = 0\n    for x in lst:\n        if x > 3:\n            total = total + x\n        else:\n            total = total - 1\n    return total\n\nprint(mystery([5, 2, 8, 3]))\nprint(mystery([]))", "answer": "11\n0", "model": "[5, 2, 8, 3]: 5>3 -> 5 | 2 -> 5-1=4 | 8>3 -> 12 | 3 is NOT >3 -> 11\n[]: the loop never runs, so total stays 0", "rubric": ["5 pts for 11 (watch 3 > 3 is False)", "3 pts for 0"]}, {"type": "free", "n": "7", "title": "Write 3 good tests for this function", "pts": 12, "topic": "tdd", "code": "def count_passing(scores):\n    ''' Returns how many scores in the list are 60 or above '''\n    count = 0\n    for s in scores:\n        if s >= 60:\n            count = count + 1\n    return count", "model": "def test_count_passing():\n    print(\"------------ test_count_passing ------------\")\n    # typical: a mix of passing and failing scores\n    result = count_passing([45, 72, 90])\n    if result == 2:\n        print(\"PASS\")\n    else:\n        print(\"FAIL: expected 2, got\", result)\n    # boundary: 60 passes, 59 does not\n    result = count_passing([60, 59])\n    if result == 1:\n        print(\"PASS\")\n    else:\n        print(\"FAIL: expected 1, got\", result)\n    # edge: empty list\n    result = count_passing([])\n    if result == 0:\n        print(\"PASS\")\n    else:\n        print(\"FAIL: expected 0, got\", result)", "rubric": ["about 3.5 pts per test (call + expected value + PASS/FAIL + why-comment)", "Full credit needs the 59/60 boundary and the empty-list edge, not three typical lists", "1.5 pts for the test function header"]}, {"type": "free", "n": "8", "title": "Writing code: strings", "pts": 12, "topic": "patterns", "prompt": "a) count_upper(text): return how many characters in text are capital letters A–Z. b) reverse_word(word): return word backwards, using a loop (no slicing tricks). Just the function definitions.", "model": "def count_upper(text):\n    count = 0\n    for ch in text:\n        if ch >= \"A\" and ch <= \"Z\":\n            count = count + 1\n    return count\n\ndef reverse_word(word):\n    result = \"\"\n    for ch in word:\n        result = ch + result\n    return result", "rubric": ["6 pts each part", "count_upper: counter starts at 0 BEFORE the loop; compares each character (ch.isupper() also earns full credit)", "reverse_word: result starts as \"\" and each character is added to the FRONT"]}, {"type": "free", "n": "9", "title": "Writing code: lists", "pts": 14, "topic": "lists", "prompt": "a) average(nums): return the average of a list of numbers, or 0 if the list is empty. b) above(nums, limit): return a NEW list of the numbers in nums that are greater than limit, without changing nums. Just the function definitions.", "model": "def average(nums):\n    if len(nums) == 0:\n        return 0\n    total = 0\n    for x in nums:\n        total = total + x\n    return total / len(nums)\n\ndef above(nums, limit):\n    result = []\n    for x in nums:\n        if x > limit:\n            result.append(x)\n    return result", "rubric": ["7 pts each part", "average: handles [] BEFORE dividing (no ZeroDivisionError); returns total / len", "above: builds a new list with [] and append; uses > not >=; does not modify nums"]}, {"type": "free", "n": "10", "title": "Writing code: while loops", "pts": 10, "topic": "while", "prompt": "count_down_sum(n): use a while loop to return n + (n − 2) + (n − 4) + … for every term that is still greater than 0. Example: count_down_sum(7) = 7 + 5 + 3 + 1 = 16; count_down_sum(0) = 0. Just the function definition.", "model": "def count_down_sum(n):\n    total = 0\n    while n > 0:\n        total = total + n\n        n = n - 2\n    return total", "rubric": ["3 pts total starts at 0 before the loop", "3 pts correct condition (n > 0)", "2 pts update n = n - 2 inside the loop", "2 pts returns total after the loop"]}]};
R.final=()=>renderExam('final'); R.pm=()=>renderExam('pm'); R.mock=()=>renderExam('mock'); R.q7=()=>renderExam('q7');

/* boot */
const h=(location.hash||'').slice(1); go(R[h]&&h!=='plan_old'?h:'home');
